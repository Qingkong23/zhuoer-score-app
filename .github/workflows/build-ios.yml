name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild -project ZhuoerScoreApp.xcodeproj \
            -scheme ZhuoerScoreApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ZhuoerScore-unsigned.ipa Payload
          ls -lh ZhuoerScore-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ZhuoerScore-unsigned-ipa
          path: ZhuoerScore-unsigned.ipa
